name: Publish extension
on:
  workflow_run:
    workflows: [Validate and package]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version from package.json (for retry/manual publish)
        required: true
        type: string
      ci_run_id:
        description: Successful Validate and package run ID containing the Node 24 VSIX
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false
jobs:
  detect-release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_ci_run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a reviewed package version change
        id: release
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_BEFORE_SHA: ${{ github.event.workflow_run.head_sha && format('{0}^', github.event.workflow_run.head_sha) || '' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/detect-release.mjs
      - name: Select the successful CI run that owns the tested artifact
        id: source
        env:
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: |
          if ! [[ "$SOURCE_CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "CI run ID must be numeric." >&2
            exit 1
          fi
          echo "run_id=$SOURCE_CI_RUN_ID" >> "$GITHUB_OUTPUT"

  verify-artifact:
    needs: detect-release
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify-source.outputs.head_sha }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out current master and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source run, version and unexpired Node 24 artifact
        id: verify-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ID: ${{ needs.detect-release.outputs.source_ci_run_id }}
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        run: node scripts/verify-ci-artifact.mjs
      - name: Check out the exact source commit that produced the VSIX
        env:
          SOURCE_CI_SHA: ${{ steps.verify-source.outputs.head_sha }}
        run: git checkout --detach "$SOURCE_CI_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the already-tested Node 24 VSIX from the successful CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jerrys-pixel-icons-node-24
          github-token: ${{ github.token }}
          run-id: ${{ needs.detect-release.outputs.source_ci_run_id }}
      - name: Recheck the exact CI artifact against its source commit
        run: pnpm run package:check
      - name: Compute the verified package digest
        id: digest
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          DIGEST=$(sha256sum "jerrys-pixel-icons-$RELEASE_VERSION.vsix")
          echo "sha256=${DIGEST%% *}" >> "$GITHUB_OUTPUT"
      - name: Pass the verified package to the approved publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-marketplace-vsix
          path: jerrys-pixel-icons-${{ needs.detect-release.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect-release, verify-artifact]
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=MelissaGutierrez.jerrys-pixel-icons
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact source commit that produced the VSIX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-artifact.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the verified VSIX for this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-marketplace-vsix
      - name: Confirm the approval-gated job received the same verified bytes
        env:
          EXPECTED_SHA256: ${{ needs.verify-artifact.outputs.sha256 }}
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" "jerrys-pixel-icons-$RELEASE_VERSION.vsix" | sha256sum --check --strict -
      - name: Publish exact tested VSIX using Trusted Publishing
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        run: pnpm exec vsce publish --oidc --skip-duplicate --packagePath "jerrys-pixel-icons-$RELEASE_VERSION.vsix"
      - name: Verify the public Marketplace package matches the tested bytes
        run: pnpm run release:verify
