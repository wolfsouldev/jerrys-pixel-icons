name: Publish extension
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version from package.json (e.g. 0.4.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require the exact reviewed version and changelog
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const version = process.env.EXPECTED_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || version !== manifest.version) throw Error('Version does not match the reviewed manifest');
          if (!readFileSync('CHANGELOG.md', 'utf8').includes(`## [${version}] - `)) throw Error('Missing dated release notes');
          if (manifest.publisher !== 'MelissaGutierrez' || manifest.name !== 'jerrys-pixel-icons') throw Error('Unexpected extension identity');
          NODE
      - run: pnpm run package
      - if: matrix.node == 24
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.node == 24
        run: pnpm run test:gallery
      - name: Save the tested VSIX
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketplace-vsix
          path: jerrys-pixel-icons-${{ inputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=MelissaGutierrez.jerrys-pixel-icons
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the tested artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marketplace-vsix
      - name: Recheck artifact against the reviewed source
        run: pnpm run package:check
      - name: Publish exact tested VSIX using Trusted Publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec vsce publish --oidc --packagePath "jerrys-pixel-icons-$RELEASE_VERSION.vsix"
      - name: Verify the public Marketplace package matches the tested bytes
        run: pnpm run release:verify
